<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster Phone Preview</title>

    <style>
        body {
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .iphone {
            width: 280px;
            height: 580px;
            background: #111;
            border: 8px solid #292929;
            border-radius: 42px;
            padding: 8px;
            position: relative;
        }

        .screen {
    width: 100%;
    height: 100%;
    border-radius: 32px;
    overflow: hidden;
    background: white;
    padding-top: 30px;
    box-sizing: border-box;
}

        iframe {
            width: 100%;
            height: calc(100% - 30px);
            border: none;
        }

        .island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 22px;
            background: black;
            border-radius: 20px;
            z-index: 2;
        }

        .home-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 5px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="island"></div>

        <div class="screen">
            <iframe src="http://127.0.0.1:5500/index.html"></iframe>
        </div>

        <div class="home-bar"></div>
    </div>
</body>
</html>
